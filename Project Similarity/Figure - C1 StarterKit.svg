<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="890" viewBox="0 0 1040 890" font-family="Segoe UI, Calibri, Arial, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA1AE"/>
</marker>
<style>
.t    { font-size:22px; font-weight:700; fill:#1A1A2E }
.st   { font-size:12.5px; fill:#6B7280 }
.band { font-size:10px; font-weight:700; fill:#8B92A0; letter-spacing:1.2px }
.bt   { font-size:13px; font-weight:700; fill:#1A1A2E }
.bx   { font-size:10.5px; fill:#6B7280 }
.cap  { font-size:10.5px; fill:#6B7280 }
.lg   { font-size:11.5px; fill:#4B5563 }
.bdg  { font-size:9px; font-weight:700; fill:#FFFFFF; letter-spacing:.5px }
.grey { fill:#F8F9FB; stroke:#D5D9E0; stroke-width:1.3 }
.amb  { fill:#FFF9EC; stroke:#E9A23B; stroke-width:1.6 }
.ln   { stroke:#9AA1AE; stroke-width:1.5; marker-end:url(#ar); fill:none }
</style>
</defs>

<rect width="1040" height="890" fill="#FFFFFF"/>

<!-- HEADER -->
<text class="t"  x="38" y="40">C1. Existing AI StarterKit Framework</text>
<text class="st" x="38" y="68">Each source keeps its own index. The orchestrator visits them and combines the results.</text>

<rect x="636" y="37" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B9BFC9" stroke-width="1.6"/>
<text class="lg" x="659" y="49">Exists today</text>
<rect x="766" y="37" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#E9A23B" stroke-width="1.6"/>
<text class="lg" x="789" y="49">New build</text>
<rect x="873" y="37" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#E05C5C" stroke-width="1.6"/>
<text class="lg" x="896" y="49">Cannot be reused</text>

<line x1="38" y1="90" x2="1010" y2="90" stroke="#E4E7EC" stroke-width="1"/>

<!-- SOURCES -->
<text class="band" x="38" y="145">SOURCES</text>
<rect x="164" y="112" width="216" height="56" rx="7" class="grey"/>
<text class="bt" x="272" y="136" text-anchor="middle">Project content</text>
<text class="bx" x="272" y="153" text-anchor="middle">SharePoint</text>
<rect x="466" y="112" width="215" height="56" rx="7" class="grey"/>
<text class="bt" x="573" y="136" text-anchor="middle">DBR</text>
<text class="bx" x="573" y="153" text-anchor="middle">Snowflake</text>
<rect x="767" y="112" width="215" height="56" rx="7" class="grey"/>
<text class="bt" x="874" y="136" text-anchor="middle">LDP</text>
<text class="bx" x="874" y="153" text-anchor="middle">Azure SQL</text>

<line class="ln" x1="272" y1="168" x2="272" y2="196"/>
<line class="ln" x1="573" y1="168" x2="573" y2="196"/>
<line class="ln" x1="874" y1="168" x2="874" y2="196"/>

<!-- INGESTION -->
<text class="band" x="38" y="230">INGESTION</text>
<text class="bx"   x="38" y="245">data in</text>
<rect x="164" y="200" width="216" height="60" rx="7" class="grey"/>
<text class="bt" x="272" y="226" text-anchor="middle">Ingestion pipeline</text>
<text class="bx" x="272" y="244" text-anchor="middle">unchanged</text>
<rect x="466" y="200" width="215" height="60" rx="7" class="amb"/>
<rect x="623" y="210" width="44" height="18" rx="9" fill="#F5A623"/>
<text class="bdg" x="645" y="223" text-anchor="middle">NEW</text>
<text class="bt" x="573" y="226" text-anchor="middle">DBR loader</text>
<text class="bx" x="573" y="244" text-anchor="middle">Snowflake pull</text>
<rect x="767" y="200" width="215" height="60" rx="7" class="amb"/>
<rect x="924" y="210" width="44" height="18" rx="9" fill="#F5A623"/>
<text class="bdg" x="946" y="223" text-anchor="middle">NEW</text>
<text class="bt" x="874" y="226" text-anchor="middle">LDP loader</text>
<text class="bx" x="874" y="244" text-anchor="middle">Azure SQL pull</text>

<line class="ln" x1="272" y1="260" x2="272" y2="288"/>
<line class="ln" x1="573" y1="260" x2="573" y2="288"/>
<line class="ln" x1="874" y1="260" x2="874" y2="288"/>

<!-- INDEXES -->
<text class="band" x="38" y="335">INDEXES</text>
<rect x="164" y="292" width="216" height="80" rx="7" class="grey"/>
<text class="bt" x="272" y="318" text-anchor="middle">Project Similarity</text>
<text class="bx" x="272" y="337" text-anchor="middle">existing schema</text>
<text class="bx" x="272" y="352" text-anchor="middle">1.84M chunks</text>
<rect x="466" y="292" width="215" height="80" rx="7" class="amb"/>
<rect x="623" y="302" width="44" height="18" rx="9" fill="#F5A623"/>
<text class="bdg" x="645" y="315" text-anchor="middle">NEW</text>
<text class="bt" x="573" y="318" text-anchor="middle">DBR index</text>
<text class="bx" x="573" y="337" text-anchor="middle">own schema,</text>
<text class="bx" x="573" y="352" text-anchor="middle">built by hand</text>
<rect x="767" y="292" width="215" height="80" rx="7" class="amb"/>
<rect x="924" y="302" width="44" height="18" rx="9" fill="#F5A623"/>
<text class="bdg" x="946" y="315" text-anchor="middle">NEW</text>
<text class="bt" x="874" y="318" text-anchor="middle">LDP index</text>
<text class="bx" x="874" y="337" text-anchor="middle">own schema,</text>
<text class="bx" x="874" y="352" text-anchor="middle">built by hand</text>

<text class="cap" x="164" y="389">Each source table holds different fields, so each index needs its own schema built by hand.</text>

<line class="ln" x1="272" y1="428" x2="272" y2="401"/>
<line class="ln" x1="573" y1="428" x2="573" y2="401"/>
<line class="ln" x1="874" y1="428" x2="874" y2="401"/>

<!-- RETRIEVAL -->
<text class="band" x="38" y="466">RETRIEVAL</text>
<text class="bx"   x="38" y="481">services</text>
<rect x="164" y="432" width="216" height="83" rx="7" class="grey"/>
<text class="bt" x="272" y="461" text-anchor="middle">chat_similarity</text>
<text class="bx" x="272" y="480" text-anchor="middle">bound to Project</text>
<text class="bx" x="272" y="495" text-anchor="middle">Similarity only</text>
<rect x="466" y="432" width="516" height="83" rx="7" class="amb"/>
<rect x="924" y="442" width="44" height="18" rx="9" fill="#F5A623"/>
<text class="bdg" x="946" y="455" text-anchor="middle">NEW</text>
<text class="bt" x="724" y="468" text-anchor="middle">Source-agnostic retrieval service</text>
<text class="bx" x="724" y="488" text-anchor="middle">neither existing service can query DBR or LDP as it stands</text>

<line class="ln" x1="272" y1="570" x2="272" y2="521"/>
<line class="ln" x1="573" y1="570" x2="573" y2="521"/>
<line class="ln" x1="874" y1="570" x2="874" y2="521"/>

<!-- ORCHESTRATOR -->
<text class="band" x="38" y="613">ORCHESTRATOR</text>
<rect x="164" y="570" width="818" height="115" rx="7" fill="#F8F9FB" stroke="#D5D9E0" stroke-width="1.3"/>
<text class="bt" x="180" y="595">Orchestrator preset</text>
<rect x="176" y="610" width="194" height="58" rx="6" fill="#FFFFFF" stroke="#D5D9E0" stroke-width="1.3"/>
<text class="bt" x="273" y="637" text-anchor="middle">Sequential tool calls</text>
<text class="bx" x="273" y="654" text-anchor="middle">exists today</text>
<rect x="476" y="610" width="195" height="58" rx="6" class="amb"/>
<rect x="551" y="614" width="44" height="18" rx="9" fill="#F5A623"/>
<text class="bdg" x="573" y="627" text-anchor="middle">NEW</text>
<text class="bt" x="573" y="647" text-anchor="middle">Parallel invocation</text>
<text class="bx" x="573" y="662" text-anchor="middle">not possible today</text>
<rect x="777" y="610" width="195" height="58" rx="6" class="amb"/>
<rect x="852" y="614" width="44" height="18" rx="9" fill="#F5A623"/>
<text class="bdg" x="874" y="627" text-anchor="middle">NEW</text>
<text class="bt" x="874" y="647" text-anchor="middle">Answer-level merge</text>
<text class="bx" x="874" y="662" text-anchor="middle">model reads all 3 sets</text>

<line class="ln" x1="272" y1="715" x2="272" y2="691"/>
<line class="ln" x1="874" y1="685" x2="874" y2="711"/>

<!-- PROMPT AND ANSWER -->
<rect x="164" y="715" width="216" height="55" rx="7" class="grey"/>
<text class="bt" x="272" y="748" text-anchor="middle">User prompt</text>
<rect x="767" y="715" width="215" height="55" rx="7" class="grey"/>
<text class="bt" x="874" y="740" text-anchor="middle">Answer</text>
<text class="bx" x="874" y="757" text-anchor="middle">+ citations per index</text>

<!-- NOTES -->
<rect x="164" y="795" width="401" height="77" rx="7" fill="#FDF2F2" stroke="#E05C5C" stroke-width="1.4"/>
<text x="181" y="818" font-size="11.5px" font-weight="700" fill="#C0392B">chat_RAG cannot be reused</text>
<text x="181" y="838" font-size="10.5px" fill="#B4544B">Its fixed field list (id, title, chunk, page_num,</text>
<text x="181" y="855" font-size="10.5px" fill="#B4544B">&#8230;) returns nothing against a DBR row.</text>

<rect x="583" y="795" width="399" height="77" rx="7" fill="#FFF9EC" stroke="#E9A23B" stroke-width="1.4"/>
<text x="600" y="818" font-size="11.5px" font-weight="700" fill="#B4700E">chat_similarity needs config injection</text>
<text x="600" y="838" font-size="10.5px" fill="#8A6420">Logic is already source-agnostic; index name, keys,</text>
<text x="600" y="855" font-size="10.5px" fill="#8A6420">select list and ACL map are fixed constants.</text>
</svg>
